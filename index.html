/* VOICE: gross-out cartoon, FTL-style tension, deadpan jokes about Gary
   IDEA: a dumpy middle-aged man drawn as a cutaway anatomy chart that doubles as the ship
   PICTURE: Gary himself, organs exposed, ATP veins glowing, cells brawling with germs inside him
   COLOUR and TYPE: deep meat-maroon ground, sunburnt skin, plasma-green power, ATP yellow; Pixelify Sans + Rubik
   LAYOUT: one screen, no scroll: HUD, cell roster, Gary (flexes to fill), FTL-style vertical power bars */
:root{color-scheme:dark;--bg:#16080d;--panel:#24111a;--edge:#9b4d5f;--ink:#f7e8ec;--dim:#c2a2ad;--pow:#7dff8a;--off:#3a222b;--bad:#ff4d5e;--atp:#ffd54a;--blue:#7fd4ff}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.35 Rubik,system-ui,sans-serif;overflow:hidden}
body{background:radial-gradient(120% 70% at 50% 40%,#2c0f19 0%,var(--bg) 70%)}
#app{max-width:480px;height:100vh;height:100dvh;margin:0 auto;padding:6px 6px 8px;display:flex;flex-direction:column;gap:4px}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
h2,h3{font-family:'Pixelify Sans',system-ui,sans-serif;font-weight:700}
.top{display:flex;align-items:center;gap:6px;flex:none}
#stat{flex:1;font-family:'Pixelify Sans';font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stat b{color:var(--atp)}
.hb{background:var(--panel);border:2px solid var(--edge);border-radius:6px;min-width:44px;height:36px;font-size:15px}
#meters{flex:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;font-size:11px;color:var(--dim)}
.m{display:flex;align-items:center;gap:4px}
.mt{flex:1;height:9px;background:#000;border:1px solid #5a3440;border-radius:2px;position:relative;overflow:hidden}
.mt i{position:absolute;inset:0 auto 0 0}
.m b{color:var(--ink);font-weight:500;min-width:2.2em;text-align:right;font-variant-numeric:tabular-nums}
#crew{flex:none;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;min-height:38px}
#crew::-webkit-scrollbar{display:none}
.chip{flex:none;position:relative;display:flex;align-items:center;gap:5px;background:var(--panel);border:2px solid #4e2633;border-radius:6px;padding:3px 7px 5px;height:38px;font-size:12px;overflow:hidden;cursor:pointer}
.chip>*{pointer-events:none}
.chip small{display:block;color:var(--dim);font-size:10px;white-space:nowrap;line-height:1.1}
.chip.on{border-color:var(--blue);background:#13283a}
.chip.fight{border-color:#a8383f}
.chip .hp{position:absolute;left:0;bottom:0;height:3px;background:var(--pow)}
.dot{width:13px;height:13px;border-radius:50%;border:2px solid #0008;display:inline-block;flex:none}
.c-macro{background:#ffd36b}.c-platelet{background:#ff7b88;border-radius:50%/35%}.c-tcell{background:#6ab8ff}.c-stem{background:#f2f2f2}
#board{position:relative;flex:1 1 auto;min-height:0;border-radius:14px;background:radial-gradient(70% 60% at 50% 45%,#3a1420,#1c0910);border:2px solid #4a1d29;overflow:hidden}
#board::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,#ffffff05 0 1px,transparent 1px 4px);pointer-events:none}
#gary{position:absolute;inset:0;width:100%;height:100%;display:block}
#gary.shake{animation:shake .3s}
@keyframes shake{20%{transform:translate(-4px,2px)}40%{transform:translate(4px,-2px)}60%{transform:translate(-3px,-1px)}80%{transform:translate(2px,1px)}}
.lbl{font:700 8.5px 'Pixelify Sans',sans-serif;fill:#ffffffd0;stroke:#1a0a0e;stroke-width:2.6px;paint-order:stroke;text-anchor:middle;pointer-events:none;letter-spacing:.4px}
.ov{pointer-events:none}
#crisis{position:absolute;left:6px;top:6px;font-family:'Pixelify Sans';font-size:13px;color:var(--atp);background:#0a0306cc;border-radius:6px;padding:3px 8px;pointer-events:none;max-width:60%}
#crisis:empty{display:none}
#crisis.red{color:var(--bad);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.5}}
#paused{position:absolute;left:0;right:0;top:40%;text-align:center;font-family:'Pixelify Sans';font-size:22px;color:var(--atp);text-shadow:0 2px 0 #000,0 0 12px #000;pointer-events:none;display:none}
#tip{position:absolute;left:6px;right:6px;bottom:6px;font-size:12px;background:#0a0306dd;border:1px solid #4e2633;border-radius:8px;padding:5px 9px;pointer-events:none;color:var(--dim);line-height:1.3}
#tip:empty{display:none}
#tip b{color:var(--ink)}
#power{flex:none;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:3px}
.pc{display:flex;flex-direction:column;background:var(--panel);border:2px solid #4e2633;border-radius:6px;overflow:hidden}
.pc.sel{border-color:var(--atp)}.pc.tgt{border-color:var(--blue);border-style:dashed}.pc.inf{border-color:var(--bad)}
.pc.warn{animation:warn .5s infinite alternate}
@keyframes warn{to{border-color:#ff4d5e;background:#3d0f17}}
.pc button{height:30px;border:0;background:#1b0c12;font-size:18px;line-height:1}
.pc button:active{background:#3c1b26}
.pcm{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0 3px;cursor:pointer}
.pcm>*{pointer-events:none}
.pips{display:flex;flex-direction:column-reverse;gap:2px;height:46px;justify-content:flex-start}
.pip{width:20px;height:6px;border:1px solid #000;background:var(--off);border-radius:1px}
.pip.on{background:var(--pow);box-shadow:0 0 4px #7dff8a99}
.pip.brk{background:var(--bad)}
.pcn{font:700 9.5px 'Pixelify Sans',sans-serif;white-space:nowrap;color:var(--dim)}
.pc.sel .pcn{color:var(--atp)}
#modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:12px;z-index:10}
#modal.hidden{display:none}
#mcard{background:#1d0d14;border:2px solid var(--edge);border-radius:8px;max-width:440px;width:100%;max-height:90vh;overflow:auto;padding:16px;box-shadow:0 10px 40px #000}
#mcard h2{font-size:24px;line-height:1.1;margin:4px 0 8px}
#mcard h3{font-size:16px;margin:14px 0 6px;color:var(--atp)}
#mcard p{margin:0 0 10px;font-size:15px}
.day{font-family:'Pixelify Sans';color:var(--dim);font-size:13px}
.dim{color:var(--dim)}
.choice,.buy{display:flex;width:100%;text-align:left;gap:8px;justify-content:space-between;align-items:center;background:#2b1420;border:2px solid #6b3445;border-radius:6px;padding:10px 12px;margin:6px 0;min-height:46px;font-size:15px}
.choice.blue{color:var(--blue);border-color:#2f6a8c}
.choice.go{background:#3a1d0c;border-color:var(--atp);color:var(--atp);justify-content:center;font-family:'Pixelify Sans';font-size:17px}
.choice:disabled,.buy:disabled{opacity:.38;cursor:not-allowed}
.req{font-weight:700;white-space:nowrap}
.buy{font-size:14px}.buy b{color:var(--atp);white-space:nowrap}
.warnbox{background:#3d0f17;border:1px solid var(--bad);padding:8px 10px;border-radius:6px;margin:8px 0;color:#ffb3bb}
.wallet{background:#120a0e;padding:8px 10px;border-radius:6px;font-size:13px;margin:8px 0}
ul.rules{padding-left:18px;margin:0 0 10px}ul.rules li{margin:5px 0}
.legend{display:flex;flex-wrap:wrap;gap:8px 12px;font-size:13px;margin:6px 0 12px}
.legend span{display:flex;align-items:center;gap:5px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Director's cut: readable tactical dashboard */
#app{max-width:920px;gap:6px;padding:8px;display:grid;grid-template-columns:minmax(0,1fr) minmax(300px, .8fr);grid-template-rows:auto auto auto minmax(0,1fr) auto;}
.top,#meters,#crew{grid-column:1/-1} #board{grid-column:1;grid-row:4/6} #ops{grid-column:2;grid-row:4;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:6px} #power{grid-column:2;grid-row:5;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
#ops h3{margin:0;color:var(--atp);font-size:15px}.ops-panel{background:var(--panel);border:1px solid #633343;border-radius:8px;padding:7px}.ops-panel p{margin:3px 0;font-size:12px;color:var(--dim)}.ops-btns{display:flex;gap:5px}.ops-btns button{flex:1;min-height:40px;background:#38202c;border:1px solid #a66578;border-radius:6px;font-size:12px}.ops-btns button:disabled{opacity:.42}.threat{display:flex;width:100%;align-items:center;justify-content:space-between;background:#351923;border:1px solid #a34c60;color:#ffd0d7;border-radius:5px;padding:5px 7px;margin-top:4px;text-align:left;font-size:12px}.threat b{color:#ffad79;white-space:nowrap}.pc button{height:34px}.pcm{gap:2px}.pips{flex-direction:row;height:8px;gap:2px;width:90%}.pip{flex:1;width:auto;height:8px}.pcn{font-size:12px}.roomstatus{font-size:10px;color:var(--dim);white-space:nowrap}.chip{height:44px}.chip small{font-size:11px}#tip{font-size:12px}#paused{top:9%;font-size:15px}#crisis{top:4px;max-width:96%}#meters{font-size:13px}.mt{height:12px}.hb{min-height:42px}.pc .pcm{min-height:39px}.pc.tgt .pcm{background:#173044}.day-track{display:flex;gap:3px}.day-track i{flex:1;height:5px;background:#52303c;border-radius:2px}.day-track i.done{background:#7dff8a}.day-track i.now{background:#ffd54a}.ops-panel .small{font-size:11px}.pc.inf .roomstatus{color:#ff9caa}

<script>
{
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const hash=n=>{const x=Math.sin(n*127.1+31.7)*43758.5453;return x-Math.floor(x);};
const f1=n=>n.toFixed(1);
const NS='http://www.w3.org/2000/svg';
const MAXLVL=6;

const KEYS=['heart','lungs','brain','immune','liver','gut','muscle','skin'];
const ORG={
 brain:{n:'Brain',s:'Brain'},lungs:{n:'Lungs',s:'Lungs'},heart:{n:'Heart',s:'Heart'},liver:{n:'Liver',s:'Liver'},
 immune:{n:'Spleen',s:'Spleen'},gut:{n:'Gut',s:'Gut'},muscle:{n:'Muscles',s:'Muscle'},skin:{n:'Skin',s:'Skin'},
};
const EFFECT={
 heart:()=>`cells cross the body in ${f1(travelTime())}s${S.organs.heart.pow?'':' · ARREST: Gary is dying'}`,
 lungs:()=>{const r=ep('lungs')*1.6-2.4;return `oxygen ${r>=0?'+':''}${f1(r)}/s (2 bars to hold steady)`;},
 brain:()=>`${Math.round(ep('brain')*7)}% chance Gary dodges incoming trauma`,
 immune:()=>`antibodies hit every germ in the body for ${f1(ep('immune')*.8)}/s`,
 liver:()=>`filters ${f1(ep('liver')*1.2+.2)} toxins/s (over 50% hurts Gary)`,
 gut:()=>`digesting +${f1(ep('gut')*.2*60)} nutrients/min`,
 muscle:()=>`absorbs ${Math.round(ep('muscle')*8)}% of all trauma`,
 skin:()=>`blocks ${Math.round(Math.min(.75,ep('skin')*.15)*100)}% of germs entering cuts`,
};
const CEN={brain:[180,46],lungs:[132,222],heart:[174,224],liver:[142,272],immune:[259,264],gut:[190,316],muscle:[134,428],skin:[62,282]};
const ANC={brain:{c:[180,62],g:[180,38]},lungs:{c:[132,246],g:[230,222]},heart:{c:[174,250],g:[174,222]},liver:{c:[155,284],g:[130,268]},immune:{c:[255,294],g:[259,262]},gut:{c:[160,338],g:[205,314]},muscle:{c:[134,438],g:[226,426]},skin:{c:[62,250],g:[298,262],v:1}};
const CL=[[0,0],[16,-7],[-16,-7],[10,12],[-10,12]],CLV=[[0,0],[0,18],[0,-18],[0,36],[0,-36]];
const CELLS={
 macro:{n:'Macrophage',hp:100,atk:10,rep:.6,cost:25,d:'eats germs, repairs slowly'},
 platelet:{n:'Platelet',hp:60,atk:3,rep:1.7,cost:20,d:'fast repairs, weak fighter'},
 tcell:{n:'Killer T-Cell',hp:130,atk:22,rep:.25,cost:45,d:'elite germ assassin'},
 stem:{n:'Stem Cell',hp:80,atk:5,rep:1.1,cost:35,d:'repairs + heals cells in its organ'},
};
const BUGS={
 bact:{n:'Bacteria',i:'🦠',hp:60,atk:7,od:.06,split:9},
 virus:{n:'Virus',i:'👾',hp:40,atk:5,od:.08,split:7},
 parasite:{n:'Parasite',i:'🪱',hp:130,atk:13,od:.12,split:0},
};
const NAMES=['Kevin','Deb','Rhonda','Lil Phil','Brenda','Tito','Gus','Marge','Dwayne','Patty','Earl','Nadine','Sal','Bev','Chad','Doris','Big Lou','Trish'];
const CAUSES={arrest:'Cardiac arrest',hypoxia:'Forgot how to breathe',toxins:'Poisoned himself, recreationally',trauma:'Blunt-force stupidity',brain:'Brain stopped braining',infection:'Overrun by germs'};

const bug=(b,rooms,every,o={})=>({type:'bug',bug:b,rooms,every,...o});
const hit=(rooms,every,msgs,o={})=>({type:'hit',rooms,every,msgs,dmg:1.5,...o});
const tox=(amt,every,msgs)=>({type:'tox',amt,every,msgs});
const o2=(amt,every,msgs)=>({type:'o2',amt,every,msgs});
const cr=(name,dur,...gens)=>({name,dur,gens});

const EVENTS=[
{id:'sushi',title:'Gas Station Sushi',text:"Gary found a tray of gas-station sushi that's been under a heat lamp since breakfast. He's sniffing it. He's smiling.",ch:[
 {t:'Let him eat it.',go:()=>({msg:'It was warm. It was chewy. It was a mistake. Bacteria are headed for the gut.',nutr:12,cr:cr('Food Poisoning',35,bug('bact',['gut'],7))})},
 {t:'Flood the stomach with acid.',req:['gut',3],go:()=>({msg:'The acid nukes most of it. Most.',nutr:12,cr:cr('Mild Food Poisoning',30,bug('bact',['gut'],13))})},
 {t:"Trigger the 'that smells like a crime' instinct.",req:['brain',3],go:()=>({msg:'Gary tosses it. Then buys a hot dog that has been rotating since 2019. Small victories.',nutr:6,cr:cr('Roller Grill Regret',25,bug('bact',['gut'],15))})},
]},
{id:'energy',title:'The 1 AM Energy Drink',text:"It's 1 AM. Gary has \"a big day tomorrow,\" so he's cracking his fourth can of VOLT BLAST XTREME ZERO. The can says 'not recommended for children, pregnant women, or people.'",ch:[
 {t:'Ride the lightning.',go:()=>({msg:'His heart is doing a drum solo. No real sleep tonight.',noSleep:1,cr:cr('Caffeine Overload',35,hit(['heart'],8,['Heart skips a beat','Heart tries to leave via the ribs','Palpitations']),tox(8,6,['More caffeine absorbed']))})},
 {t:'Let the heart absorb it.',req:['heart',4],go:()=>({msg:'Your beefy heart shrugs it off. Sleep is still canceled.',noSleep:1,cr:cr('Jittery',30,tox(8,6,['More caffeine absorbed']))})},
 {t:'Make him yawn so hard he gives up.',req:['brain',3],go:()=>Math.random()<.5?({msg:'Gary falls asleep mid-sip. A rare win.',vit:2}):({msg:'He yawns, says "I\'m good actually," and finishes the can.',noSleep:1,cr:cr('Caffeine Overload',35,hit(['heart'],8,['Heart skips a beat','Palpitations']),tox(8,6,['More caffeine absorbed']))})},
]},
{id:'tramp',title:'Watch This',text:"Gary is at his nephew's 7th birthday party. He has spotted the trampoline. He announces \"watch this\" to no one in particular.",ch:[
 {t:'Let him cook.',go:()=>({msg:'He gets free cake first. Then physics happens.',nutr:10,cr:cr('Trampoline Incident',30,hit(['brain','muscle','skin'],5,['Gary lands on his neck','Gary bounces off a 7-year-old','Backflip attempted, frontflop achieved','Knee meets chin']),bug('bact',['skin'],10,{skin:1}))})},
 {t:'Stick the landing.',req:['muscle',3],go:()=>({msg:"He lands it! The kids go wild. Then he does it again and doesn't.",nutr:10,cr:cr('Encore',20,hit(['muscle','skin'],7,['Encore goes poorly','Ankle rolls']))})},
 {t:'Remind him he is 39.',req:['brain',3],go:()=>({msg:'He does a "safe" cartwheel instead. Pulls a hamstring anyway.',nutr:10,cr:cr('Cartwheel',14,hit(['muscle'],5,['Hamstring goes twang']))})},
]},
{id:'bach',title:"Tony's Bachelor Party",text:"Gary's buddy Tony is getting married. The bachelor party has a 47-step itinerary. Step 1 is 'shots.'",ch:[
 {t:'Shots.',go:()=>({msg:'Wings, shots, a mechanical bull. Your liver just filed a complaint.',nutr:15,cr:cr('Bachelor Party',40,tox(14,5,['Another round','Someone ordered a "Liquid Regret"','Tequila happened']),hit(['brain','skin'],11,['Gary walks into a glass door','Thrown by the mechanical bull']))})},
 {t:'Pre-game the liver.',req:['liver',4],go:()=>({msg:'Your liver cracks its knuckles.',nutr:15,cr:cr('Bachelor Party (Managed)',40,tox(10,7,['Another round','Tequila happened']),hit(['brain'],14,['Thrown by the mechanical bull']))})},
 {t:'Volunteer him as designated driver.',req:['brain',4],go:()=>({msg:'Gary drinks soda and judges everyone. Smart. Boring. Alive.',nutr:15,cr:cr('Carrying Tony',15,hit(['muscle'],6,['Gary carries Tony to the car']))})},
]},
{id:'pit',title:'The Ball Pit',text:"Gary takes his nephew to an indoor play place and climbs into the ball pit himself. Nobody has cleaned these balls since 1998. A child is sneezing directly at his face.",ch:[
 {t:'Dive in!',go:()=>({msg:'He comes up gasping and grinning. Viruses are inbound to the lungs.',cr:cr('Ball Pit Plague',35,bug('virus',['lungs'],6),bug('virus',['brain','gut'],14))})},
 {t:'Immune system on high alert.',req:['immune',3],go:()=>({msg:'Your spleen was ready for this.',cr:cr('Ball Pit Sniffles',30,bug('virus',['lungs'],10))})},
 {t:'Stay at the snack bar.',go:()=>({msg:'Gary eats four soft pretzels. The sneezing kid follows him there anyway.',nutr:10,cr:cr('Pretzel Germs',25,bug('virus',['lungs'],14))})},
]},

let S;
const broken=k=>{const o=S.organs[k];return Math.min(o.lvl,Math.floor(o.hurt+1e-6));};
const usable=k=>S.organs[k].lvl-broken(k);
const freeATP=()=>S.atp-KEYS.reduce((a,k)=>a+S.organs[k].pow,0);
const crewAt=k=>S.crew.filter(c=>c.loc===k&&!c.dest);
const bugsAt=k=>S.bugs.filter(b=>b.loc===k);
const ep=k=>{const p=S.organs[k].pow;return p<=0?0:p+(crewAt(k).length&&!bugsAt(k).length?.5:0);};
const dmgMul=k=>1/(1+.35*ep(k));
const travelTime=()=>4/(.5+ep('heart')*.5);

function log(m){S.toast=m;S.toastT=3;}
function fx(k,txt,col,kind){const [x,y]=CEN[k];S.fx.push({x:x+rnd(-6,6),y,txt,col,kind,life:1.1,max:1.1});}
function hurt(k,a){const o=S.organs[k];o.hurt=Math.min(o.lvl,o.hurt+a);const u=usable(k);if(o.pow>u){o.lost+=o.pow-u;o.pow=u;}}
function repair(k,a){const o=S.organs[k];o.hurt=Math.max(0,o.hurt-a);while(o.lost>0&&o.pow<usable(k)&&freeATP()>0){o.pow++;o.lost--;}if(o.hurt===0)o.lost=0;}
function setPow(k,d){const o=S.organs[k];if(S.over)return;if(d>0){if(o.pow<usable(k)&&freeATP()>0)o.pow++;}else if(o.pow>0)o.pow--;o.lost=0;}
function addCrew(k,loc){const used=S.crew.map(c=>c.name);const name=pick(NAMES.filter(n=>!used.includes(n)))||('Cell '+S.uid);S.crew.push({id:S.uid++,k,name,hp:CELLS[k].hp,loc,from:loc,dest:null,mv:0});}
function spawnBug(k,loc,quiet){S.bugs.push({id:S.uid++,k,hp:BUGS[k].hp,loc,st:rnd(0,3),tg:Math.floor(Math.random()*9)});if(!quiet){log(`${BUGS[k].i} ${BUGS[k].n} broke into the ${ORG[loc].n}!`);fx(loc,'INVADED','#9cff6a');}}
function drain(a,cause){S.vit-=a;if(a>0)S.cause=cause;}

// generators queue telegraphed threats; tox/o2 land immediately
function fire(g){
 const m=g.msgs?pick(g.msgs):'';
 if(g.type==='bug'){const room=pick(g.rooms);S.pend.push({kind:'bug',room,bug:g.bug,skin:g.skin,n:g.n||2,t:3,tmax:3});log(`⚠ ${BUGS[g.bug].n} incoming → ${ORG[room].n} in 3s`);}
 else if(g.type==='hit'){const room=pick(g.rooms);S.pend.push({kind:'hit',room,msg:m,dmg:g.dmg||1.2,noDodge:g.noDodge,t:3.5,tmax:3.5});log(`⚠ Incoming: ${m} → ${ORG[room].n}`);}
 else if(g.type==='tox'){S.tox=Math.min(100,S.tox+g.amt);log(`☠️ ${m} (+${g.amt} toxins)`);fx('liver',`+${g.amt} TOX`,'#c2ff3b');}
 else if(g.type==='o2'){S.o2=Math.max(0,S.o2-g.amt);log(`💨 ${m} (−${g.amt} O₂)`);fx('lungs',`−${g.amt} O₂`,'#6ad1ff');}
}
function resolve(p){
 if(p.kind==='bug'){if(p.skin&&Math.random()<Math.min(.75,ep('skin')*.15)){log('Skin sealed the cut. Germ blocked!');fx('skin','BLOCKED','#ffd54a');return;}for(let i=0;i<p.n;i++)if(bugsAt(p.room).length<5)spawnBug(p.bug,p.room,i>0);return;}
 if(!p.noDodge&&Math.random()<ep('brain')*.07){log(`Brain reflex! Gary dodged: "${p.msg}"`);fx(p.room,'DODGED','#7fd4ff');return;}
 const d=p.dmg*dmgMul(p.room)*(1-Math.min(.5,ep('muscle')*.08));
 hurt(p.room,d);drain(1.2*d,'trauma');S.organs[p.room].flash=.35;S.shake=.3;
 fx(p.room,`−${f1(d)}`,'#ff4d5e','pow');
 log(`💥 ${p.msg}! ${ORG[p.room].n} −${f1(d)} bar${S.organs[p.room].pow?` (power cut it by ${Math.round((1-dmgMul(p.room))*100)}%)`:''}`);
}

function tick(dt){
 if(S.phase!=='crisis'||S.paused||S.modal||S.over)return;
 const C=S.crisis;S.t+=dt;S.clock+=dt;
 if(S.surgeLeft>0){S.surgeLeft-=dt;if(S.surgeLeft<=0){S.atp-=2;while(freeATP()<0){const k=[...KEYS].reverse().find(k=>S.organs[k].pow>(k==='heart'?1:0));if(!k)break;setPow(k,-1);}log('⚡ Surge expired.');}}
 if(S.t<C.dur)for(const g of C.gens){g.next-=dt;if(g.next<=0){g.next=g.every*rnd(.85,1.15);fire(g);}}
 else if(!S.fever&&S.bugs.length){S.fever=1;log('🌡️ Fever kicks in! Germs are weakening.');}
 S.pend=S.pend.filter(p=>{p.t-=dt;if(p.t<=0){resolve(p);return false;}return true;});
 S.o2=clamp(S.o2+(ep('lungs')*1.6-2.4)*dt,0,100);
 if(S.o2<25){drain(.3*dt,'hypoxia');S.crew.forEach(c=>{if(!c.dest)c.hp-=2.5*dt;});hurt('brain',.012*dt);}
 S.tox=clamp(S.tox-(ep('liver')*1.2+.2)*dt,0,100);
 if(S.tox>50){const f=(S.tox-50)/50;hurt('liver',(.04*f+.01)*dmgMul('liver')*dt);hurt('brain',.025*f*dt);drain(.25*f*dt,'toxins');}
 if(S.organs.heart.pow<=0)drain(.8*dt,'arrest');
 if(usable('brain')<=0)drain(.6*dt,'brain');
 S.nf+=ep('gut')*.2*dt;while(S.nf>=1){S.nf--;S.nutr++;S.dayNutr++;fx('gut','+1','#ffd54a');}
 const ip=ep('immune'),born=[];
 for(const b of S.bugs){const T=BUGS[b.k];
  b.hp-=(ip*.8+ep(b.loc)*1+(S.fever?2.5:0))*dt;
  hurt(b.loc,T.od*dmgMul(b.loc)*dt);drain(.04*dt,'infection');
  const cs=crewAt(b.loc);if(cs.length)cs[b.tg%cs.length].hp-=T.atk*dt;
  if(T.split&&!S.fever){b.st+=dt;if(b.st>=T.split*(1+ip*.35)){b.st=0;if(bugsAt(b.loc).length+born.filter(x=>x[1]===b.loc).length<5)born.push([b.k,b.loc]);}}
 }
 born.forEach(([k,l])=>{spawnBug(k,l,true);fx(l,'SPLIT!','#9cff6a');});
 const travel=travelTime();
 for(const k of KEYS){const cs=crewAt(k),bs=bugsAt(k);
  cs.forEach((c,i)=>{const T=CELLS[c.k];
   if(bs.length)bs[i%bs.length].hp-=T.atk*dt;
   else if(S.organs[k].hurt>0)repair(k,T.rep*.1*dt);
   else c.hp=Math.min(T.hp,c.hp+1.5*dt);
   if(c.k==='stem')cs.forEach(o=>o.hp=Math.min(CELLS[o.k].hp,o.hp+3*dt));});
 }
 for(const c of S.crew)if(c.dest){c.mv+=dt;if(c.mv>=travel){c.loc=c.dest;c.dest=null;c.mv=0;}}
 S.bugs=S.bugs.filter(b=>{if(b.hp<=0){S.kills++;fx(b.loc,'SPLAT','#9cff6a','pow');log(`✅ ${BUGS[b.k].n} destroyed in the ${ORG[b.loc].n}.`);return false;}return true;});
 S.crew=S.crew.filter(c=>{if(c.hp<=0){S.lost++;log(`💀 ${c.name} the ${CELLS[c.k].n} died heroically in the ${ORG[c.loc].n}.`);if(S.sel===c.id)S.sel=null;return false;}return true;});
 if(S.vit<=0){S.vit=0;gameOver();return;}
 if(S.t>=C.dur&&!S.bugs.length&&!S.pend.length)night();
}

const ov={},art={},ves={};
function buildBoard(){
 for(const k of KEYS){
  art[k]=$('#art-'+k);
  const mk=(fill)=>{const u=document.createElementNS(NS,'use');u.setAttribute('href','#sil-'+k);u.setAttribute('fill',fill);u.setAttribute('stroke','none');u.setAttribute('opacity','0');u.setAttribute('class','ov');art[k].appendChild(u);return u;};
  const dk=mk('#12040a'),rd=mk('#ff2a3d'),gl=mk('#7dff8a');
  const st=document.createElementNS(NS,'use');st.setAttribute('href','#sil-'+k);st.setAttribute('fill','none');st.setAttribute('class','ov');art[k].appendChild(st);
  ov[k]={dk,rd,gl,st};
 }
 document.querySelectorAll('#vessels path').forEach(p=>ves[p.dataset.k]=p);
 $('#power').innerHTML=KEYS.map(k=>`<div class="pc" data-k="${k}"><button data-d="1" aria-label="More power to ${ORG[k].n}">+</button><div class="pcm"><div class="pips"></div><span class="pcn">${ORG[k].s}</span><span class="roomstatus"></span></div><button data-d="-1" aria-label="Less power to ${ORG[k].n}">−</button></div>`).join('');
}
function sa(el,n,v){const key='_'+n;if(el[key]!==v){el.setAttribute(n,v);el[key]=v;}}
function setH(el,h){if(el._h!==h){el.innerHTML=h;el._h=h;}}
function sendTo(k){
 const c=S.crew.find(x=>x.id===S.sel);
 if(c&&!(c.loc===k&&!c.dest)&&c.dest!==k){if(c.dest){const f=clamp(c.mv/travelTime(),0,1);c.loc=f>.5?c.dest:c.from;}c.from=c.loc;c.dest=k;c.mv=0;}
 S.sel=null;S.selOrg=k;
 if(c)log(`${c.name} → ${ORG[k].n}`);
}
function organTap(k){if(S.over)return;if(S.sel)sendTo(k);else S.selOrg=S.selOrg===k?null:k;}
const svg=$('#gary');
svg.addEventListener('click',e=>{
 if(!S||S.over)return;
 const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const p=pt.matrixTransform(svg.getScreenCTM().inverse());
 let best=null,bd=15;
 for(const id in S.pos){const [x,y]=S.pos[id];const d=Math.hypot(x-p.x,y-p.y);if(d<bd){bd=d;best=+id;}}
 const h=e.target.closest&&e.target.closest('.hit');
 if(best!==null&&(!S.sel||best===S.sel||!h)){S.sel=S.sel===best?null:best;S.selOrg=null;return;}
 if(h)organTap(h.dataset.k);else{S.sel=null;S.selOrg=null;}
});
$('#power').addEventListener('click',e=>{const c=e.target.closest('.pc');if(!c)return;const k=c.dataset.k;const b=e.target.closest('button');if(b){setPow(k,+b.dataset.d);if(!S.sel)S.selOrg=k;}else organTap(k);});

// ---------- sprites ----------
function blob(r,n,t,seed,amp){let d='';for(let i=0;i<=n;i++){const a=i/n*Math.PI*2,rr=r+Math.sin(a*3+t*3+seed)*amp+Math.sin(a*5-t*2)*amp*.4;d+=(i?'L':'M')+f1(Math.cos(a)*rr)+' '+f1(Math.sin(a)*rr);}return d+'Z';}
function cellSprite(c,x,y,t,state){
 const sd=c.id*1.7,T=CELLS[c.k];let b='';
 if(c.k==='macro')b=`<path d="${blob(8.5,16,t,sd,1.5)}" fill="#ffd36b" stroke="#3a2208" stroke-width="1.5"/><circle cx="2.5" cy="3" r="2.4" fill="#e3a83e"/>`;
 else if(c.k==='platelet')b=`<ellipse rx="9" ry="6" fill="#ff7b88" stroke="#3a0c12" stroke-width="1.5"/><ellipse cx="1" cy="1.5" rx="4.5" ry="2.2" fill="#ffc0c7"/>`;
 else if(c.k==='tcell'){let sp='';for(let i=0;i<10;i++){const a=i/10*Math.PI*2+t*.7;sp+=`M${f1(Math.cos(a)*7.5)} ${f1(Math.sin(a)*7.5)}L${f1(Math.cos(a)*11)} ${f1(Math.sin(a)*11)}`;}b=`<path d="${sp}" stroke="#2c6aa8" stroke-width="2"/><circle r="8" fill="#6ab8ff" stroke="#0d2a4a" stroke-width="1.5"/><path d="M-6 -6.5Q0 -9 6 -6.5" stroke="#ff4d5e" stroke-width="2.2" fill="none"/>`;}
 else{const a=t*2;b=`<circle r="8" fill="#f4f4f4" stroke="#333" stroke-width="1.4"/><path transform="translate(6 -6) rotate(${f1(a*30)})" d="M0 -4L1 -1L4 0L1 1L0 4L-1 1L-4 0L-1 -1Z" fill="#ffe680" stroke="#a88a20" stroke-width=".6"/><circle cx="-3" cy="4" r="1.2" fill="#ff9ad0"/><circle cx="3" cy="4.5" r="1.1" fill="#9ad8ff"/>`;}
 const fight=state==='fight',rep=state==='repair';
 let face=`<circle cx="-2.6" cy="-1" r="1.4" fill="#1a0a0e"/><circle cx="2.6" cy="-1" r="1.4" fill="#1a0a0e"/>`;
 if(fight)face+=`<path d="M-5 -4.6L-1 -2.7M5 -4.6L1 -2.7" stroke="#1a0a0e" stroke-width="1.4"/><ellipse cx="0" cy="3" rx="1.6" ry="1.3" fill="#1a0a0e"/>`;
 else face+=`<path d="M-2.2 2.4Q0 4.2 2.2 2.4" stroke="#1a0a0e" stroke-width="1.2" fill="none"/>`;
 let extra='';
 if(rep){const by=-15+Math.sin(t*4+sd)*1.5;extra+=`<g transform="translate(0 ${f1(by)})"><circle r="4.5" fill="#123d1b" stroke="#7dff8a" stroke-width="1"/><path d="M-2.6 0H2.6M0 -2.6V2.6" stroke="#7dff8a" stroke-width="1.8"/></g>`;}
 if(state==='move'){extra+=`<path d="M-15 -3H-10M-17 1H-11M-14 5H-10" stroke="#ffffff88" stroke-width="1.2"/>`;}
 const hpF=c.hp/T.hp;

ACT.route=i=>showEvent(S.route[+i]);
ACT.choose=i=>{
 const r=S.ev.ch[+i].go();
 if(r.nutr)S.nutr+=r.nutr;if(r.vit)S.vit=Math.min(S.vmax,S.vit+r.vit);if(r.fx)r.fx();if(r.noSleep)S.noSleep=1;
 S.pending=r.cr||null;
 const ex=[r.nutr?`+${r.nutr} nutrients`:'',r.vit?`+${r.vit} vitality`:''].filter(Boolean).join(' · ');
 openModal(`<div class="day">Day ${S.day} of ${S.maxDay}</div><h2>${S.ev.title}</h2><p>${r.msg}</p>${ex?`<p class="dim">${ex}</p>`:''}`+
  (r.cr?`<div class="warnbox">⚠ Incoming: <b>${r.cr.name}</b> (${r.cr.dur}s)</div><p class="dim">The crisis starts paused. Route power and move cells, then tap ▶.</p><button class="choice go" data-act="begin">Brace for impact</button>`:`<button class="choice go" data-act="night">Survive the day</button>`));
};
ACT.begin=()=>{
 const c=S.pending;S.crisis={name:c.name,dur:c.dur,gens:c.gens.map(g=>({...g,next:g.first??g.every*rnd(.3,.7)}))};
 S.t=0;S.surgeUsed=false;S.patchUsed=false;S.surgeLeft=0;S.phase='crisis';S.paused=true;S.pend=[];S.fx=[];closeModal();S.toast='';S.toastT=0;
};
ACT.night=()=>night();
function night(){
 if(S.surgeLeft>0){S.atp-=2;S.surgeLeft=0;while(freeATP()<0){const k=[...KEYS].reverse().find(k=>S.organs[k].pow>(k==='heart'?1:0));if(!k)break;setPow(k,-1);}} S.phase='night';S.bugs=[];S.pend=[];S.fx=[];
 if(S.day>=S.maxDay){win();return;}
 const inc=10;S.nutr+=inc;
 const lines=[`+${inc} nutrients overnight${S.dayNutr?`, +${S.dayNutr} digested during the day`:''}.`];
 if(!S.noSleep){KEYS.forEach(k=>repair(k,1.5));S.vit=Math.min(S.vmax,S.vit+3);lines.push('Gary sleeps: every organ heals 1.5 bars, +3 vitality.');}
 else{KEYS.forEach(k=>repair(k,.5));lines.push("Gary barely slept: organs only heal half a bar.");}
 S.crew.forEach(c=>{c.hp=CELLS[c.k].hp;if(c.dest){c.loc=c.dest;c.dest=null;}c.from=c.loc;});
 S.tox=Math.max(0,S.tox-40);S.o2=100;S.nightLines=lines;shop();
}
function item(id,label,cost,avail){const ok=avail&&S.nutr>=cost;return `<button class="buy" data-act="buy" data-arg="${id}" ${ok?'':'disabled'}><span>${label}</span><b>${avail?cost:'max'}</b></button>`;}
function shop(keep){
 const mcost=16+4*(S.atp-9);
 openModal(`<div class="day">Night ${S.day}</div><h2>Recovery</h2>${S.nightLines.map(l=>`<p class="dim">${l}</p>`).join('')}
 <div class="wallet">🥩 <b>${S.nutr}</b> nutrients · ❤ ${Math.ceil(S.vit)}/${S.vmax} · ${S.atp} ATP · ${S.crew.length}/8 cells</div>
 <h3>Body</h3>`+item('atp',`More mitochondria: +1 ATP (more bars to juggle)`,mcost,S.atp<20)+item('veg','Force-feed a vegetable: +6 vitality',12,S.vit<S.vmax)+item('fix','Urgent care: fully heal every organ',20,KEYS.some(k=>S.organs[k].hurt>0))+
 `<h3>Upgrade organs (more bars, unlocks choices)</h3>`+KEYS.map(k=>{const o=S.organs[k];return item('up:'+k,`${ORG[k].n} Lv${o.lvl} → ${o.lvl+1}`,o.lvl*12,o.lvl<MAXLVL);}).join('')+
 `<h3>Recruit cells</h3>`+Object.keys(CELLS).map(k=>item('rec:'+k,`<span style="display:flex;align-items:center;gap:6px">${mini(k)} ${CELLS[k].n} · ${CELLS[k].d}</span>`,CELLS[k].cost,S.crew.length<8)).join('')+
 `<p class="dim" style="margin-top:10px">New organ bars start unpowered. Route ATP to them on the board.</p><button class="choice go" data-act="wake">Wake Gary up (Day ${S.day+1})</button>`,keep);
}
ACT.buy=id=>{
 const [a,b]=id.split(':');let cost=0;
 if(a==='atp'){cost=16+4*(S.atp-9);if(S.nutr<cost)return;S.atp++;}
 else if(a==='veg'){cost=12;if(S.nutr<cost)return;S.vit=Math.min(S.vmax,S.vit+6);}
 else if(a==='fix'){cost=20;if(S.nutr<cost)return;KEYS.forEach(k=>repair(k,9));}
 else if(a==='up'){const o=S.organs[b];cost=o.lvl*12;if(S.nutr<cost||o.lvl>=MAXLVL)return;o.lvl++;}
 else if(a==='rec'){cost=CELLS[b].cost;if(S.nutr<cost||S.crew.length>=8)return;addCrew(b,'heart');}
 S.nutr-=cost;shop(true);
};
ACT.wake=()=>{closeModal();startDay();};
function gameOver(){S.over=true;S.phase='over';
 openModal(`<div class="day">Day ${S.day} of ${S.maxDay}</div><h2>Gary has died.</h2><p>Cause of death: <b>${CAUSES[S.cause]||'Being Gary'}</b>.</p><p class="dim">Last decision: ${S.ev?S.ev.title:'—'}. Germs destroyed: ${S.kills}. Cells lost: ${S.lost}.</p><button class="choice go" data-act="restart">Try again with a new Gary</button>`);}
function win(){S.over=true;S.phase='over';
 openModal(`<h2>Gary turned 40.</h2><p>He survived ten days of his own decisions. He has learned absolutely nothing.</p><p class="dim">Vitality left: ${Math.ceil(S.vit)}/${S.vmax}. Germs destroyed: ${S.kills}. Cells lost: ${S.lost}.</p><button class="choice go" data-act="restart">Do it again</button>`);}
ACT.restart=()=>newGame(true);
mc.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;ACT[b.dataset.act](b.dataset.arg);});

$('#threats').addEventListener('click',e=>{const b=e.target.closest('[data-room]');if(b)organTap(b.dataset.room);});
$('#boost').addEventListener('click',()=>{if($('#boost').disabled)return;S.surgeUsed=true;S.surgeLeft=8;S.atp+=2;log('⚡ Emergency mitochondria surge!');});
$('#patch').addEventListener('click',()=>{if($('#patch').disabled)return;S.patchUsed=true;repair(S.selOrg,1);fx(S.selOrg,'PATCHED','#7dff8a');log('🩹 Emergency repair: '+ORG[S.selOrg].n);});
$('#crew').addEventListener('pointerdown',e=>{const c=e.target.closest('.chip');if(!c)return;const id=+c.dataset.id;S.sel=S.sel===id?null:id;S.selOrg=null;});
$('#pauseBtn').addEventListener('click',()=>{if(S.phase==='crisis')S.paused=!S.paused;});
$('#speedBtn').addEventListener('click',()=>{S.speed=S.speed===1?2:S.speed===2?3:1;});
document.addEventListener('keydown',e=>{if(e.code==='Escape'&&!S.modal){S.sel=null;S.selOrg=null;}if(e.code==='Space'&&S.phase==='crisis'&&!S.modal){e.preventDefault();S.paused=!S.paused;}});

function newGame(skipIntro){
 S={day:0,maxDay:10,atp:9,nutr:15,vit:30,vmax:30,o2:100,tox:0,phase:'idle',t:0,clock:0,paused:false,speed:1,organs:{},crew:[],bugs:[],pend:[],fx:[],pos:{},sel:null,selOrg:null,toast:'',toastT:0,crisis:null,used:[],noSleep:0,uid:1,kills:0,lost:0,cause:'',over:false,modal:false,fever:0,shake:0,nf:0,dayNutr:0};
 const st={heart:[3,2],lungs:[3,2],brain:[2,1],immune:[2,1],liver:[2,1],gut:[2,1],muscle:[2,0],skin:[2,1]};
 KEYS.forEach(k=>S.organs[k]={lvl:st[k][0],pow:st[k][1],hurt:0,lost:0,flash:0});
 addCrew('macro','gut');addCrew('macro','lungs');addCrew('platelet','heart');
 if(skipIntro)startDay();else intro();
}
let last=0;
function loop(ts){
 const rdt=Math.min(.1,(ts-last)/1000||0);last=ts;
 if(S){for(let i=0;i<S.speed;i++)tick(rdt);
  const live=!S.paused&&!S.modal;
  if(!live||S.phase!=='crisis')S.clock+=rdt*.35;
  KEYS.forEach(k=>{const o=S.organs[k];if(o.flash>0)o.flash-=rdt;});
  if(S.shake>0)S.shake-=rdt;
  if(live){if(S.toastT>0)S.toastT-=rdt;S.fx=S.fx.filter(e=>(e.life-=rdt*S.speed)>0);}
  render();}
 requestAnimationFrame(loop);
}
buildBoard();newGame();requestAnimationFrame(loop);
}
</script>
<script>if("serviceWorker"in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});</script>
</body>
